version: 1
id: long-context
mode: scripted
route_label_version: v1
description: Rolling window and repeated @ without cross-session bleed
limits:
  max_turns: 40
  max_duration_ms: 1200000
  messages_per_minute: 20
actors:
  - id: lin_xi
    name: 林夕
    profile_env: MSTD_SIM_BOT_PRODUCT_PROFILE
  - id: zhou_yan
    name: 周岩
    profile_env: MSTD_SIM_BOT_ENGINEER_PROFILE
  - id: he_miao
    name: 何淼
    profile_env: MSTD_SIM_BOT_OPS_PROFILE
turns:
  - id: ctx-seed-001
    actor: lin_xi
    text: "@小达 记住关键词 CANARY_ALPHA_ONLY_THIS_SESSION"
    expect:
      route: escalate
  - id: ctx-noise-001
    actor: he_miao
    text: "无关闲聊 1"
    after_ms: 200
    expect:
      route: observed
  - id: ctx-noise-002
    actor: he_miao
    text: "无关闲聊 2"
    after_ms: 200
    expect:
      route: observed
  - id: ctx-recall-001
    actor: zhou_yan
    text: "@小达 刚才林夕说的关键词是什么"
    after_ms: 500
    expect:
      route: escalate
  - id: ctx-repeat-at
    actor: lin_xi
    text: "@小达 @小达 再确认一次关键词"
    after_ms: 500
    expect:
      route: escalate
