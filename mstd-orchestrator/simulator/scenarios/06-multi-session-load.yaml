version: 1
id: multi-session-load
mode: scripted
route_label_version: v1
description: >
  Throughput must use multiple independent sessions/chats.
  This file only exercises sequential light turns in one chat as a scaffold;
  real L3 load requires runner multi-chat fanout (not single-session).
limits:
  max_turns: 15
  max_duration_ms: 600000
  messages_per_minute: 20
actors:
  - id: lin_xi
    name: 林夕
    profile_env: MSTD_SIM_BOT_PRODUCT_PROFILE
  - id: zhou_yan
    name: 周岩
    profile_env: MSTD_SIM_BOT_ENGINEER_PROFILE
  - id: he_miao
    name: 何淼
    profile_env: MSTD_SIM_BOT_OPS_PROFILE
turns:
  - id: load-001
    actor: lin_xi
    text: "@小达 ping-1"
    expect:
      route: quick_reply
  - id: load-002
    actor: zhou_yan
    text: "@小达 ping-2"
    after_ms: 300
    expect:
      route: quick_reply
  - id: load-003
    actor: he_miao
    text: "旁听噪声不该触发"
    after_ms: 200
    expect:
      route: observed
